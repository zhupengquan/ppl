<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E293B">
<title>训练日志</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#F4F5F7;color:#1E293B;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:96px}

header{background:#1E293B;color:#fff;padding:14px 16px 12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.hbtns{display:flex;gap:8px}
.hbtns button{border:0;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);color:#E2E8F0}
.hbtns button.on{background:#2563EB;color:#fff}
.sub{font-size:12px;color:#94A3B8;margin-top:5px}

main{padding:12px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.07);margin-bottom:12px}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.cal-head b{font-size:15px}
.cal-head button{border:0;background:#F1F5F9;color:#334155;width:32px;height:32px;border-radius:9px;font-size:18px;line-height:1;padding:0}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px 6px;color:#94A3B8;font-size:11px;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 10px 12px}
.cd{border:0;background:#F8FAFC;border-radius:10px;height:42px;font-size:14px;color:#334155;font-weight:500;position:relative;display:flex;align-items:center;justify-content:center}
.cd.blank{background:transparent}
.cd.has{background:#1E293B;color:#fff;font-weight:700}
.cd.today{outline:2px solid #93C5FD;outline-offset:-2px}
.cd.sel{outline:3px solid #2563EB;outline-offset:-3px}
.cd .pd{position:absolute;bottom:5px;width:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.55)}

/* 当日 */
.dayhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:14px;font-weight:600}
.dayhead .cnt{font-size:12px;font-weight:500;color:#64748B}

.ex{padding:14px;border-top:1px solid #F1F5F9}
.exh{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.exh b{font-size:15px;flex:1;min-width:0;line-height:1.35}
.tag{font-size:11px;background:#F1F5F9;color:#64748B;border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none;margin-top:1px}
.del{border:0;background:transparent;color:#CBD5E1;font-size:20px;line-height:1;padding:0 2px;flex:none}
.hint{font-size:12px;color:#94A3B8;margin:-4px 0 10px}
.last{font-size:12px;color:#64748B;margin-bottom:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.last b{color:#1E293B;font-weight:600}
.badge{font-size:11px;background:#DCFCE7;color:#15803D;border-radius:5px;padding:2px 6px;font-weight:600}
.badge.warn{background:#FFEDD5;color:#C2410C}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.f{min-width:0}
.f label{display:block;font-size:11px;color:#94A3B8;margin-bottom:3px;text-align:center}
.f input{width:100%;min-width:0;border:1px solid #E2E8F0;background:#FCFCFD;border-radius:9px;padding:9px 4px;font-size:15px;text-align:center;color:#1E293B;font-family:inherit}
.f input:focus{outline:2px solid #BFDBFE;border-color:#93C5FD}
.sets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sets .f label{font-size:10px}
.sets input{font-size:16px;font-weight:600}

.addbtn{display:block;width:100%;border:0;background:#fff;color:#2563EB;font-size:15px;font-weight:600;padding:16px;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.07)}
.empty{padding:28px 20px;text-align:center;color:#94A3B8;font-size:14px;line-height:1.7}

/* 弹层 */
.sheet{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column}
.sheet.hidden{display:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #F1F5F9;background:#fff}
.sheet-head b{font-size:15px}
.sheet-head button{border:0;background:transparent;color:#2563EB;font-size:15px;padding:0}
.pk-search{padding:10px 16px 6px}
.pk-search input{width:100%;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit}
.pk-tabs{display:flex;gap:7px;padding:8px 16px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.pk-tabs button{border:0;background:#F1F5F9;color:#475569;border-radius:8px;padding:7px 10px;font-size:13px;white-space:nowrap;flex:none;font-weight:500}
.pk-tabs button.on{background:#1E293B;color:#fff}
.pk-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 40px}
.pk-item{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid #F1F5F9}
.pk-item .nm{flex:1;min-width:0;font-size:14px;line-height:1.35;word-break:break-word}
.pk-item .mt{font-size:11px;color:#94A3B8;white-space:nowrap;flex:none}
.pk-more{padding:14px;text-align:center;color:#94A3B8;font-size:13px}

/* 周总结 */
.wk-body{padding:16px;overflow-y:auto;flex:1}
.wk-big{display:flex;gap:10px;margin-bottom:16px}
.wk-big div{flex:1;background:#F8FAFC;border-radius:12px;padding:12px;text-align:center}
.wk-big span{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px}
.wk-big b{font-size:20px;font-weight:700}
.wk-sec{font-size:12px;color:#94A3B8;margin:16px 0 8px;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.bar .lb{width:32px;color:#475569;flex:none}
.bar .tr{flex:1;height:9px;background:#F1F5F9;border-radius:5px;overflow:hidden;display:block}
.bar .fi{display:block;height:100%;border-radius:5px;background:#2563EB}
.bar .vl{width:46px;text-align:right;color:#64748B;font-size:12px;flex:none}
.wk-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:13px}
.wk-row span:last-child{color:#64748B}

/* 底部 */
.bar-bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(244,245,247,.94);backdrop-filter:blur(8px);display:flex;gap:10px}
.bar-bottom button{flex:1;border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:600;font-family:inherit}
#save{background:#2563EB;color:#fff}
#save:disabled{background:#CBD5E1;color:#F8FAFC}
#exp{flex:none;width:92px;background:#fff;color:#475569;box-shadow:0 1px 3px rgba(15,23,42,.1)}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(30,41,59,.94);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center}
.toast.show{opacity:1}

.cf{margin-bottom:14px}
.cf label{display:block;font-size:13px;color:#64748B;margin-bottom:6px}
.cf input{width:100%;border:1px solid #E2E8F0;border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;background:#FCFCFD}
.cbtn{width:100%;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:600;font-family:inherit;margin-bottom:9px}
.cbtn.primary{background:#2563EB;color:#fff}
.cbtn.ghost{background:#F1F5F9;color:#475569}
.cstate{font-size:13px;color:#94A3B8;text-align:center;margin:6px 0 0}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>训练日志</h1>
    <div class="hbtns">
      <button id="wkBtn">周总结</button>
      <button id="cloudBtn">本地</button>
    </div>
  </div>
  <div class="sub" id="subline">点日期 · 选动作 · 记重量</div>
</header>

<main>
  <section class="card">
    <div class="cal-head">
      <button id="prevM">‹</button>
      <b id="calTitle">—</b>
      <button id="nextM">›</button>
    </div>
    <div class="dow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="cgrid" id="calGrid"></div>
  </section>

  <section class="card" id="dayCard"></section>
  <button class="addbtn" id="addBtn">+ 添加动作</button>
</main>

<div class="sheet hidden" id="picker">
  <div class="sheet-head">
    <button id="pkClose">取消</button>
    <b>选择动作</b>
    <span style="width:34px"></span>
  </div>
  <div class="pk-search"><input id="pkQ" placeholder="搜索动作名（英文）" autocomplete="off"></div>
  <div class="pk-tabs" id="pkTabs"></div>
  <div class="pk-list" id="pkList"></div>
</div>

<div class="sheet hidden" id="wkPanel">
  <div class="sheet-head">
    <button id="wkClose">关闭</button>
    <b>周总结</b>
    <span style="width:34px"></span>
  </div>
  <div class="wk-body" id="wkBody"></div>
</div>

<div class="sheet hidden" id="cloudSheet">
  <div class="sheet-head">
    <button id="cClose">关闭</button>
    <b>云同步</b>
    <span style="width:34px"></span>
  </div>
  <div class="wk-body">
    <p style="font-size:13px;color:#64748B;line-height:1.7;margin:0 0 16px">
      配一次，手机和电脑共用一份数据。练完自动上传，打开页面自动拉取。<br>
      数据存在你自己的 GitHub 私有 Gist 里，只有拿着 Token 的人能看。
    </p>
    <div class="cf">
      <label>GitHub Token（只需 gist 权限）</label>
      <input id="cToken" placeholder="ghp_... 或 github_pat_..." autocomplete="off">
    </div>
    <div class="cf">
      <label>Gist ID（留空自动新建）</label>
      <input id="cGist" placeholder="留空即可" autocomplete="off">
    </div>
    <button class="cbtn primary" id="cConnect">连接并同步</button>
    <button class="cbtn ghost" id="cNow">立即同步</button>
    <button class="cbtn ghost" id="cOff">断开云同步</button>
    <p class="cstate" id="cState"></p>
  </div>
</div>

<div class="bar-bottom">
  <button id="save">保存本次训练</button>
  <button id="exp">导出</button>
</div>

<div class="toast" id="toast"></div>

function load(){
  try{ const s=localStorage.getItem(KEY); if(s) mem=JSON.parse(s); }catch(e){}
  mem.logs = mem.logs||{}; mem.draft = mem.draft||{};
  if(!Object.keys(mem.logs).length) migrate();
}
function migrate(){
  try{
    const old = JSON.parse(localStorage.getItem(KEY_OLD)||"null");
    if(!old || !old.history) return;
    Object.keys(old.history).forEach(k=>{
      const [day, act] = k.split("|");
      (old.history[k]||[]).forEach(e=>{
        if(!e.d) return;
        if(!mem.logs[e.d]) mem.logs[e.d] = {moves:[], day: day};
        if(!mem.logs[e.d].day) mem.logs[e.d].day = day;
        mem.logs[e.d].moves.push({n:act, e:"", t:"", g:"", w:e.w==null?"":String(e.w), s:(e.s||[]).map(x=>x==null?"":String(x)), r:e.r==null?"":String(e.r)});
      });
    });
    store();
  }catch(e){}
}
function store(){ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} if(typeof scheduleSync==="function") scheduleSync(); }

function blankMove(o){ return {n:o.n||"", e:o.e||"", t:o.t||"", g:o.g||"", w:"", s:["","","",""], r:""}; }
function dayLog(d){ if(!mem.logs[d]) mem.logs[d]={moves:[]}; return mem.logs[d]; }
function volOf(mv){ const w=Number(mv.w)||0; return w*(mv.s||[]).reduce((a,v)=>a+(Number(v)||0),0); }
function dayVol(lg){ return (lg.moves||[]).reduce((a,m)=>a+volOf(m),0); }
function grpOf(mv){ return mv.g || TG2G[mv.t] || "其他"; }

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1900);
}

// ---------- 日历 ----------
function renderCal(){
  const first = new Date(calY, calM-1, 1);
  const startDow = (first.getDay()+6)%7;
  const dim = new Date(calY, calM, 0).getDate();
  document.getElementById("calTitle").textContent = calY+"年"+calM+"月";
  let html="";
  for(let i=0;i<startDow;i++) html+='<div class="cd blank"></div>';
  for(let d=1; d<=dim; d++){
    const ds = dstr(calY, calM, d);
    const lg = mem.logs[ds];
    const has = lg && (lg.moves||[]).length;
    const cls = "cd"+(has?" has":"")+(ds===todayStr()?" today":"")+(ds===sel?" sel":"");
    html += `<button class="${cls}" data-d="${ds}">${d}</button>`;
  }
  document.getElementById("calGrid").innerHTML = html;
  document.querySelectorAll(".cd[data-d]").forEach(b=>{
    b.onclick = ()=>{ sel=b.dataset.d; renderCal(); renderDay(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
}

// ---------- 当日 ----------
function renderDay(){
  const lg = mem.logs[sel];
  const moves = lg ? (lg.moves||[]) : [];
  const v = lg ? dayVol(lg) : 0;
  const head = `<div class="dayhead">
      <span>${sel.slice(5).replace("-","/")} ${wdName(sel)}</span>
      <span class="cnt">${moves.length} 个动作${v>0?" · "+Math.round(v)+"kg":""}</span>
    </div>`;

  if(!moves.length){
    document.getElementById("dayCard").innerHTML = head +
      `<p class="empty">这天还没有动作<br>点下面的「添加动作」开始</p>`;
    return;
  }

  const body = moves.map((mv,i)=>{
    const tg = (TG_CN[mv.t]||mv.t||"");
    const eq = (EQ_CN[mv.e]||mv.e||"");
    const meta = [eq,tg].filter(Boolean).join(" · ");
    const last = lastOf(mv.n);
    let lastHtml = `<div class="last">还没有记录过这个动作</div>`;
    if(last){
      const wTxt = Number(last.w)>0 ? `<b>${last.w}kg</b>` : `<b>自重</b>`;
      const reps = (last.s||[]).filter(x=>x!=="").join("/")||"—";
      lastHtml = `<div class="last">上次 <b>${last.d.slice(5)}</b> · ${wTxt} · ${reps}</div>`;
    }
    const sets = [0,1,2,3].map(j=>
      `<div class="f"><label>第${j+1}组</label><input inputmode="numeric" data-i="${i}" data-j="${j}" value="${(mv.s&&mv.s[j])||""}" placeholder="—"></div>`).join("");
    return `<section class="ex">
      <div class="exh">
        <b>${mv.n}</b>
        ${meta?`<span class="tag">${meta}</span>`:""}
        <button class="del" data-del="${i}">×</button>
      </div>
      ${lastHtml}
      <div class="grid">
        <div class="f"><label>重量 kg</label><input inputmode="decimal" data-i="${i}" data-k="w" value="${mv.w||""}" placeholder="0"></div>
        <div class="f"><label>剩余次数</label><input inputmode="numeric" data-i="${i}" data-k="r" value="${mv.r||""}" placeholder="—"></div>
      </div>
      <div class="sets">${sets}</div>
    </section>`;
  }).join("");

  document.getElementById("dayCard").innerHTML = head + body;

  document.querySelectorAll("#dayCard input").forEach(inp=>{
    inp.oninput = ()=>{
      const i = +inp.dataset.i;
      const mv = mem.logs[sel].moves[i];
      if(inp.dataset.k) mv[inp.dataset.k] = inp.value;
      else { mv.s = mv.s||["","","",""]; mv.s[+inp.dataset.j] = inp.value; }
      mem.logs[sel].moves[i] = mv;
      store();
      const v2 = dayVol(mem.logs[sel]);
      const cnt = document.querySelector("#dayCard .dayhead .cnt");
      if(cnt) cnt.textContent = `${mem.logs[sel].moves.length} 个动作${v2>0?" · "+Math.round(v2)+"kg":""}`;
    };
  });
  document.querySelectorAll("#dayCard .del").forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.del;
      const nm = mem.logs[sel].moves[i].n;
      mem.logs[sel].moves.splice(i,1);
      if(!mem.logs[sel].moves.length) delete mem.logs[sel];
      store(); renderCal(); renderDay();
      toast("已删除 "+nm);
    };
  });
}

function lastOf(name){
  const ds = Object.keys(mem.logs).filter(d=> d<sel).sort().reverse();
  for(const d of ds){
    const m = (mem.logs[d].moves||[]).find(x=>x.n===name);
    if(m && (m.w!==""||(m.s||[]).some(x=>x!==""))) return {d:d, w:m.w, s:m.s};
  }
  return null;
}

// ---------- 动作选择器 ----------
let pkTab = "常用", pkQuery = "", pkLimit = 60;
const PK_TABS = ["常用","胸","背","腿","肩","手臂","核心","全部"];

function openPicker(){
  document.getElementById("picker").classList.remove("hidden");
  pkTab="常用"; pkQuery=""; pkLimit=60;
  document.getElementById("pkQ").value="";
  renderPkTabs(); renderPkList();
}
function closePicker(){ document.getElementById("picker").classList.add("hidden"); }

function renderPkTabs(){
  document.getElementById("pkTabs").innerHTML = PK_TABS.map(t=>
    `<button class="${t===pkTab?"on":""}" data-t="${t}">${t}</button>`).join("");
  document.querySelectorAll("#pkTabs button").forEach(b=>{
    b.onclick = ()=>{ pkTab=b.dataset.t; pkLimit=60; renderPkTabs(); renderPkList(); };
  });
}

function pkRows(){
  const q = pkQuery.trim().toLowerCase();
  if(q){
    const hit = [];
    for(let i=0;i<EX.length;i++){
      if(EX[i][1].toLowerCase().includes(q)) hit.push({n:EX[i][1], e:EX[i][2], t:EX[i][3], g:TG2G[EX[i][3]]||"", en:true});
      if(hit.length>=400) break;
    }
    COMMON.forEach(c=>{ if(c[0].includes(pkQuery.trim())) hit.unshift({n:c[0], e:c[1], t:c[2], g:TG2G[c[2]]||"", en:false}); });
    return hit;
  }
  if(pkTab==="常用") return COMMON.map(c=>({n:c[0],e:c[1],t:c[2],g:TG2G[c[2]]||"",en:false}));
  if(pkTab==="全部") return EX.map(r=>({n:r[1],e:r[2],t:r[3],g:TG2G[r[3]]||"",en:true}));
  const want = {"胸":["chest"],"背":["back"],"腿":["upper-legs","lower-legs"],"肩":["shoulders"],"手臂":["upper-arms","lower-arms"],"核心":["waist"]}[pkTab]||[];
  const out = [];
  for(let i=0;i<EX.length;i++){
    if(want.includes(EX[i][4])) out.push({n:EX[i][1],e:EX[i][2],t:EX[i][3],g:TG2G[EX[i][3]]||"",en:true});
  }
  return out;
}

function renderPkList(){
  const rows = pkRows();
  const shown = rows.slice(0, pkLimit);
  const items = shown.map(r=>{
    const meta = [(EQ_CN[r.e]||r.e)||"", (TG_CN[r.t]||"")||""].filter(Boolean).join(" · ");
    return `<div class="pk-item" data-n="${encodeURIComponent(r.n)}" data-e="${encodeURIComponent(r.e||"")}" data-t="${encodeURIComponent(r.t||"")}" data-g="${encodeURIComponent(r.g||"")}">
      <span class="nm">${r.n}</span><span class="mt">${meta}</span>
    </div>`;
  }).join("");
  const more = rows.length>pkLimit ? `<div class="pk-more" id="pkMore">还有 ${rows.length-pkLimit} 个 · 点这里再加载 60 个</div>` : "";
  document.getElementById("pkList").innerHTML = items + more;
  document.querySelectorAll("#pkList .pk-item").forEach(el=>{
    el.onclick = ()=>{
      const mv = blankMove({n:decodeURIComponent(el.dataset.n), e:decodeURIComponent(el.dataset.e), t:decodeURIComponent(el.dataset.t), g:decodeURIComponent(el.dataset.g)});
      dayLog(sel).moves.push(mv);
      store(); renderCal(); renderDay(); closePicker();
      toast("已添加 "+mv.n);
    };
  });
  const moreEl = document.getElementById("pkMore");
  if(moreEl) moreEl.onclick = ()=>{ pkLimit+=60; renderPkList(); };
}

// ---------- 周总结 ----------
function mondayOf(ds){
  const d = parseD(ds);
  const off = (d.getDay()+6)%7;
  d.setDate(d.getDate()-off);
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function shiftDays(ds, n){
  const d = parseD(ds); d.setDate(d.getDate()+n);
  const p=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function weekStats(start){
  const days = [];
  for(let i=0;i<7;i++) days.push(shiftDays(start,i));
  const sess = days.filter(d=> mem.logs[d] && (mem.logs[d].moves||[]).length);
  let vol = 0; const grp = {}; const sets = {};
  sess.forEach(d=>{
    const lg = mem.logs[d];
    vol += dayVol(lg);
    lg.moves.forEach(m=>{
      const g = grpOf(m);
      const ns = (m.s||[]).filter(x=>x!=="").length || 0;
      grp[g] = (grp[g]||0) + ns;
      sets[g] = (sets[g]||0) + 1;
    });
  });
  return {days, sess, vol, grp};
}
function renderWeek(){
  const w1 = mondayOf(sel);
  const w2 = shiftDays(w1,-7);
  const a = weekStats(w1), b = weekStats(w2);
  const diff = b.vol>0 ? Math.round((a.vol-b.vol)/b.vol*100) : 0;
  const dTxt = diff>0?`+${diff}%`:(diff<0?`${diff}%`:"—");
  const maxG = Math.max(1, ...GRPS.map(g=>a.grp[g]||0));

  const bars = GRPS.map(g=>{
    const v = a.grp[g]||0;
    const w = Math.round(v/maxG*100);
    return `<div class="bar"><span class="lb">${g}</span><span class="tr"><span class="fi" style="width:${w}%"></span></span><span class="vl">${v} 组</span></div>`;
  }).join("");

  const rows = a.days.filter(d=> mem.logs[d] && (mem.logs[d].moves||[]).length).map(d=>{
    const lg = mem.logs[d];
    return `<div class="wk-row"><span>${d.slice(5).replace("-","/")} ${wdName(d)}</span><span>${lg.moves.length} 个动作 · ${Math.round(dayVol(lg))}kg</span></div>`;
  }).join("") || `<p class="empty">这周还没有训练记录</p>`;

  document.getElementById("wkBody").innerHTML = `
    <div style="font-size:13px;color:#64748B;margin-bottom:12px">${w1.slice(5).replace("-","/")} — ${shiftDays(w1,6).slice(5).replace("-","/")}</div>
    <div class="wk-big">
      <div><span>训练次数</span><b>${a.sess.length}</b></div>
      <div><span>总容量 kg</span><b>${Math.round(a.vol)}</b></div>
      <div><span>较上周</span><b>${dTxt}</b></div>
    </div>
    <div class="wk-sec">各部位组数</div>
    ${bars}
    <div class="wk-sec">本周明细</div>
    ${rows}
    <div class="wk-sec">上周对比</div>
    <div class="wk-row"><span>上周训练</span><span>${b.sess.length} 次 · ${Math.round(b.vol)}kg</span></div>`;
  document.getElementById("wkPanel").classList.remove("hidden");
}

// ---------- 导出 ----------
function exportCsv(){
  const rows = [["日期","动作","器械","肌群","重量","第1组","第2组","第3组","第4组","剩余"]];
  Object.keys(mem.logs).sort().forEach(d=>{
    (mem.logs[d].moves||[]).forEach(m=>{
      rows.push([d, m.n, EQ_CN[m.e]||m.e||"", TG_CN[m.t]||m.t||"", m.w||"", ...(m.s||["","","",""]), m.r||""]);
    });
  });
  const csv = "\ufeff" + rows.map(r=> r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "训练记录_"+todayStr()+".csv";
  a.click();
}

// ---------- 云同步 ----------
const CKEY = "ppl_cloud_v2", GFILE = "ppl-data.json";
let cloud = {token:"", gist:"", last:0};
try{ Object.assign(cloud, JSON.parse(localStorage.getItem(CKEY)||"{}")); }catch(e){}
function saveCloud(){ try{ localStorage.setItem(CKEY, JSON.stringify(cloud)); }catch(e){} }

async function ghApi(method, path, body){
  const r = await fetch("https://api.github.com"+path, {
    method: method,
    headers: {"Authorization":"Bearer "+cloud.token, "Accept":"application/vnd.github+json", "Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : undefined
  });
  if(!r.ok){ const t = await r.text().catch(()=> ""); throw new Error(r.status+" "+t.slice(0,80)); }
  return r.json();
}

function normRemote(remote){
  if(remote && remote.logs) return remote.logs;
  const logs = {};
  if(remote && remote.history){
    Object.keys(remote.history).forEach(k2=>{
      const parts = k2.split("|"), act = parts[1];
      (remote.history[k2]||[]).forEach(e=>{
        if(!e.d) return;
        if(!logs[e.d]) logs[e.d] = {moves:[]};
        logs[e.d].moves.push({n:act, e:"", t:"", g:"", w:(e.w==null?"":String(e.w)), s:(e.s||[]).map(x=>x==null?"":String(x)), r:(e.r==null?"":String(e.r))});
      });
    });
  }
  return logs;
}

async function cloudPull(silent){
  if(!cloud.token){ updateCloudUI("off","未连接 · 数据只在本机"); return; }
  try{
    updateCloudUI("sync","同步中…");
    if(!cloud.gist){
      const list = await ghApi("GET","/gists?per_page=100");
      const f = Array.isArray(list) ? list.find(g=> g.files && g.files[GFILE]) : null;
      if(!f){ updateCloudUI("ok","已连接 · 云端暂无数据"); return; }
      cloud.gist = f.id; saveCloud();
    }
    const g = await ghApi("GET","/gists/"+cloud.gist);
    const file = g.files && g.files[GFILE];
    if(!file){ updateCloudUI("ok","云端还没有数据"); return; }
    const txt = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
    const rl = normRemote(JSON.parse(txt));
    let added = 0;
    Object.keys(rl).forEach(d=>{
      if(!mem.logs[d] || !(mem.logs[d].moves||[]).length){ mem.logs[d] = rl[d]; added++; }
    });
    if(added){ localStorage.setItem(KEY, JSON.stringify(mem)); renderCal(); renderDay(); }
    cloud.last = Date.now(); saveCloud();
    updateCloudUI("ok", added ? ("已拉取 "+added+" 天") : "已是最新");
  }catch(e){ updateCloudUI("err","拉取失败："+e.message); }
}

async function cloudPush(){
  if(!cloud.token) return;
  try{
    updateCloudUI("sync","上传中…");
    const body = {description:"训练日志", public:false,
      files:{[GFILE]:{content: JSON.stringify({v:2, logs:mem.logs, t:Date.now()})}}};
    if(!cloud.gist){
      const g = await ghApi("POST","/gists", body);
      cloud.gist = g.id;
    }else{
      await ghApi("PATCH","/gists/"+cloud.gist, body);
    }
    cloud.last = Date.now(); saveCloud();
    updateCloudUI("ok","已上传 · 共 "+Object.keys(mem.logs).length+" 天");
  }catch(e){ updateCloudUI("err","上传失败："+e.message); }
}

let syncT = null;
function scheduleSync(){
  if(syncT) clearTimeout(syncT);
  syncT = setTimeout(()=>{ if(cloud && cloud.token) cloudPush(); }, 2500);
}

function updateCloudUI(state, msg){
  const b = document.getElementById("cloudBtn");
  const label = {off:"本地", sync:"同步中", ok:"云 ✓", err:"异常"}[state] || "本地";
  if(b){ b.textContent = label; b.classList.toggle("on", state==="ok"); }
  const st = document.getElementById("cState");
  if(st) st.textContent = msg || "";
}

function initCloud(){
  document.getElementById("cToken").value = cloud.token || "";
  document.getElementById("cGist").value = cloud.gist || "";
  if(cloud.token){ updateCloudUI("sync","检查云端…"); cloudPull(true); }
  else updateCloudUI("off","未连接 · 数据只在本机");
}

document.getElementById("cloudBtn").onclick = ()=>{
  document.getElementById("cloudSheet").classList.remove("hidden");
  document.getElementById("cToken").value = cloud.token || "";
  document.getElementById("cGist").value = cloud.gist || "";
};
document.getElementById("cClose").onclick = ()=> document.getElementById("cloudSheet").classList.add("hidden");
document.getElementById("cConnect").onclick = ()=>{
  const t = document.getElementById("cToken").value.trim();
  const g = document.getElementById("cGist").value.trim();
  if(!t){ toast("先填 Token"); return; }
  cloud.token = t; cloud.gist = g; saveCloud();
  cloudPull().then(()=> cloudPush());
};
document.getElementById("cNow").onclick = ()=>{ if(!cloud.token){ toast("还没连接"); return; } cloudPull().then(()=> cloudPush()); };
document.getElementById("cOff").onclick = ()=>{
  cloud = {token:"", gist:"", last:0}; saveCloud();
  updateCloudUI("off","已断开 · 数据只在本机");
  document.getElementById("cToken").value = "";
  document.getElementById("cGist").value = "";
  toast("已断开云同步");
};

// ---------- 启动 ----------
load();
if(!calY){ const t=new Date(); calY=t.getFullYear(); calM=t.getMonth()+1; }
if(!sel) sel = todayStr();

document.getElementById("prevM").onclick = ()=>{ calM--; if(calM<1){calM=12;calY--;} renderCal(); };
document.getElementById("nextM").onclick = ()=>{ calM++; if(calM>12){calM=1;calY++;} renderCal(); };
document.getElementById("addBtn").onclick = openPicker;
document.getElementById("pkClose").onclick = closePicker;
document.getElementById("pkQ").oninput = e=>{ pkQuery=e.target.value; pkLimit=60; renderPkList(); };
document.getElementById("wkBtn").onclick = renderWeek;
document.getElementById("wkClose").onclick = ()=> document.getElementById("wkPanel").classList.add("hidden");
document.getElementById("save").onclick = ()=>{
  if(!mem.logs[sel] || !(mem.logs[sel].moves||[]).length){ toast("这天还是空的，先加动作"); return; }
  store(); renderCal();
  toast("已保存 · "+Math.round(dayVol(mem.logs[sel]))+"kg");
};
document.getElementById("exp").onclick = exportCsv;

renderCal(); renderDay(); initCloud();
</script>
