<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E293B">
<title>训练日志</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#F4F5F7;color:#1E293B;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:96px}

header{background:#1E293B;color:#fff;padding:14px 16px 12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.hbtns{display:flex;gap:8px}
.hbtns button{border:0;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);color:#E2E8F0}
.hbtns button.on{background:#2563EB;color:#fff}
.sub{font-size:12px;color:#94A3B8;margin-top:5px}

main{padding:12px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.07);margin-bottom:12px}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.cal-head b{font-size:15px}
.cal-head button{border:0;background:#F1F5F9;color:#334155;width:32px;height:32px;border-radius:9px;font-size:18px;line-height:1;padding:0}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px 6px;color:#94A3B8;font-size:11px;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 10px 12px}
.cd{border:0;background:#F8FAFC;border-radius:10px;height:42px;font-size:14px;color:#334155;font-weight:500;position:relative;display:flex;align-items:center;justify-content:center}
.cd.blank{background:transparent}
.cd.has{background:#1E293B;color:#fff;font-weight:700}
.cd.today{outline:2px solid #93C5FD;outline-offset:-2px}
.cd.sel{outline:3px solid #2563EB;outline-offset:-3px}
.cd .pd{position:absolute;bottom:5px;width:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.55)}
.cd .pdots{position:absolute;bottom:4px;left:0;right:0;display:flex;gap:2.5px;justify-content:center}
.cd .pdots i{width:4.5px;height:4.5px;border-radius:50%;display:block}
.cd.sel .pdots i{box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.prow{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.prow label{width:44px;font-size:14px;color:#475569}
.prow input{flex:1;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:10px;padding:9px 12px;font-size:16px;font-weight:700;color:#1E293B;font-family:inherit;outline:none;text-align:center}
.prow input:focus{border-color:#2563EB;background:#fff}
.prow span{font-size:13px;color:#94A3B8;width:22px}
.pbtn{width:100%;border:0;background:#2563EB;color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:600;margin-top:4px;font-family:inherit}
.phint{font-size:12px;color:#94A3B8;line-height:1.6;margin:12px 0 0}
.bmibox{background:#F8FAFC;border-radius:12px;padding:14px;margin-bottom:18px;text-align:center}
.psep{height:1px;background:#F1F5F9;margin:18px 0}
.pbtn2{width:100%;border:1px solid #E2E8F0;background:#fff;color:#334155;border-radius:12px;padding:12px;font-size:14px;font-weight:600;margin-bottom:10px;font-family:inherit}
.pbtn2:active{background:#F8FAFC}
.bmibox .bv{font-size:28px;font-weight:800;color:#1E293B;line-height:1.1}
.bmibox .bl{font-size:12px;color:#64748B;margin-top:5px}
.bmibox .bt{font-size:12px;margin-top:8px;font-weight:600}
.lastcard{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:2px}
.lastcard .li{font-size:12.5px;color:#475569;background:#F8FAFC;border-radius:8px;padding:5px 10px}
.lastcard .li b{color:#1E293B}
.up{font-size:11px;font-weight:700;color:#059669;background:#D1FAE5;border-radius:6px;padding:1px 6px}
.down{font-size:11px;font-weight:700;color:#B45309;background:#FEF3C7;border-radius:6px;padding:1px 6px}
.same{font-size:11px;font-weight:600;color:#94A3B8;background:#F1F5F9;border-radius:6px;padding:1px 6px}

/* 当日 */
.dayhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:14px;font-weight:600}
.dayhead .cnt{font-size:12px;font-weight:500;color:#64748B}

.ex{padding:14px;border-top:1px solid #F1F5F9}
.exh{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.exh b{font-size:15px;flex:1;min-width:0;line-height:1.35}
.wline{display:flex;align-items:center;gap:7px;margin:0 0 10px}
.wl{font-size:12px;color:#94A3B8;flex:none}
.wmini{width:70px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:9px;padding:5px 8px;font-size:14px;text-align:center;font-weight:700;color:#0F172A;outline:none;font-family:inherit}
.wmini:focus{border-color:#2563EB;background:#fff}
.wu{font-size:12px;color:#94A3B8;flex:none}
.exth{width:46px;height:46px;object-fit:cover;border-radius:10px;flex:none;cursor:pointer;background:#0D1422}
.pk-item .pth{width:46px;height:46px;object-fit:cover;border-radius:10px;flex:none;background:#0D1422}
.pk-item .pth.ph{display:block;background:#F1F5F9}
.tag[data-g="胸"]{background:#FEE2E2;color:#B91C1C}
.tag[data-g="背"]{background:#DBEAFE;color:#1D4ED8}
.tag[data-g="腿"]{background:#FFEDD5;color:#C2410C}
.tag[data-g="肩"]{background:#F3E8FF;color:#7E22CE}
.tag[data-g="手臂"]{background:#DCFCE7;color:#15803D}
.tag[data-g="核心"]{background:#FEF3C7;color:#B45309}
.tag[data-g="有氧"]{background:#CCFBF1;color:#0F766E}
.wnote{width:100%;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:9px;padding:6px 9px;font-size:13px;color:#334155;font-family:inherit;outline:none}
.wnote:focus{border-color:#2563EB;background:#fff}
.tag{font-size:11px;background:#F1F5F9;color:#64748B;border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none;margin-top:1px}
.del{border:0;background:transparent;color:#CBD5E1;font-size:20px;line-height:1;padding:0 2px;flex:none}
.hint{font-size:12px;color:#94A3B8;margin:-4px 0 10px}
.last{font-size:12px;color:#64748B;margin-bottom:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.last b{color:#1E293B;font-weight:600}
.badge{font-size:11px;background:#DCFCE7;color:#15803D;border-radius:5px;padding:2px 6px;font-weight:600}
.badge.warn{background:#FFEDD5;color:#C2410C}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.f{min-width:0}
.f label{display:block;font-size:11px;color:#94A3B8;margin-bottom:3px;text-align:center}
.f input{width:100%;min-width:0;border:1px solid #E2E8F0;background:#FCFCFD;border-radius:9px;padding:9px 4px;font-size:15px;text-align:center;color:#1E293B;font-family:inherit}
.f input:focus{outline:2px solid #BFDBFE;border-color:#93C5FD}
.sets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sets .f label{font-size:10px}
.sets input{font-size:16px;font-weight:600}

.addbtn{display:block;width:100%;border:0;background:#fff;color:#2563EB;font-size:15px;font-weight:600;padding:16px;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.07)}
.empty{padding:28px 20px;text-align:center;color:#94A3B8;font-size:14px;line-height:1.7}

/* 弹层 */
.sheet{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column}
.sheet.hidden{display:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #F1F5F9;background:#fff}
.sheet-head b{font-size:15px}
.sheet-head button{border:0;background:transparent;color:#2563EB;font-size:15px;padding:0}
.pk-search{padding:10px 16px 6px}
.pk-search input{width:100%;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit}
.pk-tabs{display:flex;gap:7px;padding:8px 16px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.pk-tabs button{border:0;background:#F1F5F9;color:#475569;border-radius:8px;padding:7px 10px;font-size:13px;white-space:nowrap;flex:none;font-weight:500}
.pk-tabs button.on{background:#1E293B;color:#fff}
.pk-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 40px}
.pk-item{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid #F1F5F9}
.pk-item .nm{flex:1;min-width:0;font-size:14px;line-height:1.35;word-break:break-word}
.pk-item .mt{font-size:11px;color:#94A3B8;white-space:nowrap;flex:none}
.pk-more{padding:14px;text-align:center;color:#94A3B8;font-size:13px}

/* 周总结 */
.wk-body{padding:16px;overflow-y:auto;flex:1}
.wk-big{display:flex;gap:10px;margin-bottom:16px}
.wk-big div{flex:1;background:#F8FAFC;border-radius:12px;padding:12px;text-align:center}
.wk-big span{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px}
.wk-big b{font-size:20px;font-weight:700}
.wk-sec{font-size:12px;color:#94A3B8;margin:16px 0 8px;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.bar .lb{width:32px;color:#475569;flex:none}
.bar .tr{flex:1;height:9px;background:#F1F5F9;border-radius:5px;overflow:hidden;display:block}
.bar .fi{display:block;height:100%;border-radius:5px;background:#2563EB}
.bar .vl{width:46px;text-align:right;color:#64748B;font-size:12px;flex:none}
.wk-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:13px}
.wk-row span:last-child{color:#64748B}

/* 底部 */
.bar-bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(244,245,247,.94);backdrop-filter:blur(8px);display:flex;gap:10px}
.bar-bottom button{flex:1;border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:600;font-family:inherit}
#save{background:#2563EB;color:#fff}
#save:disabled{background:#CBD5E1;color:#F8FAFC}
#exp{flex:none;width:92px;background:#fff;color:#475569;box-shadow:0 1px 3px rgba(15,23,42,.1)}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(30,41,59,.94);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center}
.toast.show{opacity:1}

.cf{margin-bottom:14px}
.cf label{display:block;font-size:13px;color:#64748B;margin-bottom:6px}
.cf input{width:100%;border:1px solid #E2E8F0;border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;background:#FCFCFD}
.cbtn{width:100%;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:600;font-family:inherit;margin-bottom:9px}
.cbtn.primary{background:#2563EB;color:#fff}
.cbtn.ghost{background:#F1F5F9;color:#475569}
.cstate{font-size:13px;color:#94A3B8;text-align:center;margin:6px 0 0}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>训练日志</h1>
    <div class="hbtns">
      <button id="meBtn">我的</button>
      <button id="cloudBtn">本地</button>
    </div>
  </div>
  <div class="sub" id="subline">点日期 · 选动作 · 记重量</div>
</header>

<main>
  <section class="card">
    <div class="cal-head">
      <button id="prevM">‹</button>
      <b id="calTitle">—</b>
      <button id="nextM">›</button>
    </div>
    <div class="dow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="cgrid" id="calGrid"></div>
  </section>

  <section class="card" id="lastCard" style="display:none"></section>
  <section class="card" id="dayCard"></section>
  <button class="addbtn" id="addBtn">+ 添加动作</button>
</main>

<div class="sheet hidden" id="picker">
  <div class="sheet-head">
    <button id="pkClose">取消</button>
    <b>选择动作</b>
    <span style="width:34px"></span>
  </div>
  <div class="pk-search"><input id="pkQ" placeholder="搜索动作 / 器械 / 肌群" autocomplete="off"></div>
  <div class="pk-tabs" id="pkTabs"></div>
  <div class="pk-list" id="pkList"></div>
</div>

<div class="sheet hidden" id="imgSheet">
  <div class="sheet-head">
    <button id="imClose">关闭</button>
    <b id="imTitle">动作示范</b>
    <span style="width:34px"></span>
  </div>
  <div class="wk-body">
    <img id="imBig" src="" alt="" style="width:100%;border-radius:12px;display:block">
    <p id="imNote" style="font-size:12px;color:#94A3B8;line-height:1.6;margin:12px 0 0">
      示范图来自 free-exercise-db（Everkinetic，CC BY-SA 4.0）。看清起始位和结束位，动作幅度比重量重要。
    </p>
  </div>
</div>

<div class="sheet hidden" id="mePanel">
  <div class="sheet-head">
    <button id="meClose">关闭</button>
    <b>我的</b>
    <span style="width:34px"></span>
  </div>
  <div class="wk-body">
    <div id="bmiBox" class="bmibox"></div>
    <div class="prow"><label>身高</label><input id="pHeight" inputmode="numeric" placeholder="170"><span>cm</span></div>
    <div class="prow"><label>体重</label><input id="pWeight" inputmode="decimal" placeholder="65"><span>kg</span></div>
    <div class="prow"><label>年龄</label><input id="pAge" inputmode="numeric" placeholder="24"><span>岁</span></div>
    <button class="pbtn" id="pSave">保存</button>
    <p class="phint">身高体重只用来算 BMI，存在本机不上传。</p>
    <div class="psep"></div>
    <button class="pbtn2" id="impCsv">导入 CSV 记录</button>
    <button class="pbtn2" id="impJson">导入 JSON 备份</button>
    <input type="file" id="fileCsv" accept=".csv,text/csv" style="display:none">
    <input type="file" id="fileJson" accept=".json,application/json" style="display:none">
    <p class="phint" id="impHint">导入是合并：同一天同一个动作会被新数据覆盖，其他记录保留不动。</p>
  </div>
</div>

<div class="sheet hidden" id="cloudSheet">
  <div class="sheet-head">
    <button id="cClose">关闭</button>
    <b>云同步</b>
    <span style="width:34px"></span>
  </div>
  <div class="wk-body">
    <p style="font-size:13px;color:#64748B;line-height:1.7;margin:0 0 16px">
      配一次，手机和电脑共用一份数据。练完自动上传，打开页面自动拉取。<br>
      数据存在你自己的 GitHub 私有 Gist 里，只有拿着 Token 的人能看。
    </p>
    <div class="cf">
      <label>GitHub Token（只需 gist 权限）</label>
      <input id="cToken" placeholder="ghp_... 或 github_pat_..." autocomplete="off">
    </div>
    <div class="cf">
      <label>Gist ID（留空自动新建）</label>
      <input id="cGist" placeholder="留空即可" autocomplete="off">
    </div>
    <button class="cbtn primary" id="cConnect">连接并同步</button>
    <button class="cbtn ghost" id="cNow">立即同步</button>
    <button class="cbtn ghost" id="cOff">断开云同步</button>
    <p class="cstate" id="cState"></p>
  </div>
</div>

<div class="bar-bottom">
  <button id="save">保存本次训练</button>
  <button id="exp">导出</button>
</div>

<div class="toast" id="toast"></div>

const EQ_CN = {"body weight":"自重","dumbbell":"哑铃","cable":"绳索","barbell":"杠铃","leverage machine":"固定器械","band":"弹力带","resistance band":"阻力带","kettlebell":"壶铃","weighted":"负重","suspension trainer":"悬挂","smith machine":"史密斯","ez barbell":"曲杠","weight plate":"杠铃片","assisted":"辅助","medicine ball":"药球","stability ball":"瑜伽球","hammer":"锤","trap bar":"六角杠","olympic barbell":"奥杠","machine":"器械"};
const TG_CN = {"abs":"腹肌","glutes":"臀","quads":"股四头","delts":"三角肌","pectorals":"胸","lats":"背阔肌","biceps":"二头","triceps":"三头","calves":"小腿","upper back":"上背","hamstrings":"腘绳肌","cardiovascular system":"心肺","spine":"竖脊肌","forearms":"前臂","abductors":"外展肌","adductors":"内收肌","levator scapulae":"肩胛提肌","traps":"斜方肌","serratus anterior":"前锯肌"};
const BP_CN = {"chest":"胸","back":"背","shoulders":"肩","upper-arms":"手臂","lower-arms":"前臂","upper-legs":"腿","lower-legs":"小腿","waist":"核心","neck":"颈","full-body":"全身","cardio":"有氧"};

const TG2G = {pectorals:"胸",lats:"背","upper back":"背",traps:"背",spine:"背",delts:"肩",biceps:"手臂",triceps:"手臂",forearms:"手臂",abs:"核心",quads:"腿",hamstrings:"腿",glutes:"腿",calves:"腿",adductors:"腿",abductors:"腿",cardio:"有氧","cardiovascular system":"有氧"};
const GRPS = ["胸","背","腿","肩","手臂","核心","有氧"];
const GC = {"胸":"#EF4444","背":"#3B82F6","腿":"#F97316","肩":"#A855F7","手臂":"#22C55E","核心":"#EAB308","有氧":"#14B8A6"};


const KEY = "ppl_log_v2";
const KEY_OLD = "ppl_log_v1";
let mem = {v:2, logs:{}, draft:{}, profile:{}};
let sel = todayStr();
let calY, calM;

function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function dstr(y,m,d){ const p=n=>String(n).padStart(2,"0"); return y+"-"+p(m)+"-"+p(d); }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function wdName(s){ return ["周日","周一","周二","周三","周四","周五","周六"][parseD(s).getDay()]; }

function load(){
  try{ const s=localStorage.getItem(KEY); if(s) mem=JSON.parse(s); }catch(e){}
  mem.logs = mem.logs||{}; mem.draft = mem.draft||{};
  if(!Object.keys(mem.logs).length) migrate();
}
function migrate(){
  try{
    const old = JSON.parse(localStorage.getItem(KEY_OLD)||"null");
    if(!old || !old.history) return;
    Object.keys(old.history).forEach(k=>{
      const [day, act] = k.split("|");
      (old.history[k]||[]).forEach(e=>{
        if(!e.d) return;
        if(!mem.logs[e.d]) mem.logs[e.d] = {moves:[], day: day};
        if(!mem.logs[e.d].day) mem.logs[e.d].day = day;
        mem.logs[e.d].moves.push({n:act, e:"", t:"", g:"", w:e.w==null?"":String(e.w), s:(e.s||[]).map(x=>x==null?"":String(x)), r:e.r==null?"":String(e.r)});
      });
    });
    store();
  }catch(e){}
}
function store(){ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} if(typeof scheduleSync==="function") scheduleSync(); }

function blankMove(o){ return {n:o.n||"", e:o.e||"", t:o.t||"", g:o.g||"", img:o.img||"", w:"", s:["","","",""], r:"", cardio:!!o.cardio, dur:"", note:""}; }
function dayLog(d){ if(!mem.logs[d]) mem.logs[d]={moves:[]}; return mem.logs[d]; }
function volOf(mv){ const w=Number(mv.w)||0; return w*(mv.s||[]).reduce((a,v)=>a+(Number(v)||0),0); }
function dayVol(lg){ return (lg.moves||[]).reduce((a,m)=>a+volOf(m),0); }
function grpOf(mv){ return mv.g || TG2G[mv.t] || "其他"; }

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1900);
}

// ---------- 日历 ----------
function renderCal(){
  const first = new Date(calY, calM-1, 1);
  const startDow = (first.getDay()+6)%7;
  const dim = new Date(calY, calM, 0).getDate();
  document.getElementById("calTitle").textContent = calY+"年"+calM+"月";
  let html="";
  for(let i=0;i<startDow;i++) html+='<div class="cd blank"></div>';
  for(let d=1; d<=dim; d++){
    const ds = dstr(calY, calM, d);
    const lg = mem.logs[ds];
    const has = lg && (lg.moves||[]).length;
    const cls = "cd"+(has?" has":"")+(ds===todayStr()?" today":"")+(ds===sel?" sel":"");
    let dots = "";
    if(has){
      const gs = [];
      (lg.moves||[]).forEach(m=>{
        const g = m.cardio ? "有氧" : grpOf(m);
        if(gs.indexOf(g)<0) gs.push(g);
      });
      dots = `<span class="pdots">${gs.slice(0,4).map(g=>`<i style="background:${GC[g]||"#94A3B8"}"></i>`).join("")}</span>`;
    }
    html += `<button class="${cls}" data-d="${ds}">${d}${dots}</button>`;
  }
  document.getElementById("calGrid").innerHTML = html;
  document.querySelectorAll(".cd[data-d]").forEach(b=>{
    b.onclick = ()=>{ sel=b.dataset.d; renderCal(); renderDay(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
}

// ---------- 当日 ----------
function renderLast(){
  const el = document.getElementById("lastCard");
  const ds = Object.keys(mem.logs).filter(d=> d<sel && (mem.logs[d].moves||[]).length).sort().reverse()[0];
  if(!ds){ el.style.display="none"; return; }
  el.style.display="";
  const lg = mem.logs[ds];
  const items = (lg.moves||[]).map(m=>{
    if(m.cardio) return `<span class="li"><b>${m.n}</b> ${m.dur||"—"} 分钟</span>`;
    const reps = (m.s||[]).filter(x=>x!=="").join("/")||"—";
    const w = Number(m.w)>0 ? `${m.w}kg` : "自重";
    return `<span class="li"><b>${m.n}</b> ${w} · ${reps}</span>`;
  }).join("");
  el.innerHTML = `<div class="dayhead"><span>上次训练 · ${ds.slice(5).replace("-","/")} ${wdName(ds)}</span><span class="cnt">${lg.moves.length} 个动作</span></div><div class="lastcard">${items}</div>`;
  el.onclick = ()=>{ sel = ds; renderCal(); renderDay(); window.scrollTo({top:0,behavior:"smooth"}); };
}

function renderDay(){
  renderLast();
  const lg = mem.logs[sel];
  const moves = lg ? (lg.moves||[]) : [];
  const v = lg ? dayVol(lg) : 0;
  const head = `<div class="dayhead">
      <span>${sel.slice(5).replace("-","/")} ${wdName(sel)}</span>
      <span class="cnt">${moves.length} 个动作</span>
    </div>`;

  if(!moves.length){
    document.getElementById("dayCard").innerHTML = head +
      `<p class="empty">这天还没有动作<br>点下面的「添加动作」开始</p>`;
    return;
  }

  const body = moves.map((mv,i)=>{
    const tg = (TG_CN[mv.t]||mv.t||"");
    const eq = (EQ_CN[mv.e]||mv.e||"");
    const meta = [eq,tg].filter(x=>x&&x!=="cardio").join(" · ");
    if(mv.cardio){
      const pc = lastOf(mv.n);
      const phtml = pc ? `<div class="last">上次 <b>${pc.d.slice(5)}</b> · ${pc.dur||"—"} 分钟</div>`
                       : `<div class="last">第一次做 · 记个基线</div>`;
      return `<section class="ex">
        <div class="exh">
          ${mv.img?`<img class="exth" src="${mv.img}" data-big="${mv.img}" data-bn="${encodeURIComponent(mv.n)}" alt="示范图">`:""}
          <b>${mv.n}</b>
          <span class="tag" data-g="有氧">有氧</span>
          <button class="del" data-del="${i}">×</button>
        </div>
        ${phtml}
        <div class="wline">
          <span class="wl">时长</span>
          <input class="wmini" inputmode="numeric" data-i="${i}" data-k="dur" value="${mv.dur||""}" placeholder="0">
          <span class="wu">分钟</span>
        </div>
        <input class="wnote" data-i="${i}" data-k="note" value="${mv.note||""}" placeholder="强度 / 坡度 / 距离，可不填">
      </section>`;
    }
    const last = lastOf(mv.n);
    let lastHtml = `<div class="last">第一次练 · 记个基线</div>`;
    if(last){
      const wTxt = Number(last.w)>0 ? `<b>${last.w}kg</b>` : `<b>自重</b>`;
      const reps = (last.s||[]).filter(x=>x!=="").join("/")||"—";
      lastHtml = `<div class="last">上次 <b>${last.d.slice(5)}</b> · ${wTxt} · ${reps} <span class="cmpslot" data-cmp="${i}"></span></div>`;
    }
    const sets = [0,1,2,3].map(j=>
      `<div class="f"><label>第${j+1}组</label><input inputmode="numeric" data-i="${i}" data-j="${j}" value="${(mv.s&&mv.s[j])||""}" placeholder="—"></div>`).join("");
    return `<section class="ex">
      <div class="exh">
        ${mv.img?`<img class="exth" src="${mv.img}" data-big="${mv.img}" data-bn="${encodeURIComponent(mv.n)}" alt="示范图">`:""}
        <b>${mv.n}</b>
        ${meta?`<span class="tag" data-g="${mv.g||""}">${meta}</span>`:""}
        <button class="del" data-del="${i}">×</button>
      </div>
      ${lastHtml}
      <div class="wline">
        <span class="wl">重量</span>
        <input class="wmini" inputmode="decimal" data-i="${i}" data-k="w" value="${mv.w||""}" placeholder="0">
        <span class="wu">kg</span>
      </div>
      <div class="sets">${sets}</div>
    </section>`;
  }).join("");

  document.getElementById("dayCard").innerHTML = head + body;

  function cmpBadge(i){
    const mv = mem.logs[sel].moves[i];
    const slot = document.querySelector(`.cmpslot[data-cmp="${i}"]`);
    if(!slot) return;
    const last = lastOf(mv.n);
    if(!last){ slot.innerHTML=""; return; }
    const curW = Number(mv.w)||0, lastW = Number(last.w)||0;
    const sum = a => (a||[]).filter(x=>x!=="").reduce((s,b)=>s+(Number(b)||0),0);
    const curS = sum(mv.s), lastS = sum(last.s);
    if(curW>0 && lastW>0 && curW!==lastW){
      const d = +(curW-lastW).toFixed(1);
      slot.innerHTML = d>0 ? `<span class="up">↑ +${d}kg</span>` : `<span class="down">↓ ${d}kg</span>`;
    } else if(curS>0 && lastS>0 && curS!==lastS){
      const d = curS-lastS;
      slot.innerHTML = d>0 ? `<span class="up">↑ +${d} 次</span>` : `<span class="down">↓ ${d} 次</span>`;
    } else slot.innerHTML = "";
  }
  for(let i=0;i<moves.length;i++) cmpBadge(i);

  document.querySelectorAll("#dayCard input").forEach(inp=>{
    inp.oninput = ()=>{
      const i = +inp.dataset.i;
      const mv = mem.logs[sel].moves[i];
      if(inp.dataset.k) mv[inp.dataset.k] = inp.value;
      else { mv.s = mv.s||["","","",""]; mv.s[+inp.dataset.j] = inp.value; }
      mem.logs[sel].moves[i] = mv;
      store();
      const cnt = document.querySelector("#dayCard .dayhead .cnt");
      if(cnt) cnt.textContent = `${mem.logs[sel].moves.length} 个动作`;
      cmpBadge(i);
    };
  });
  document.querySelectorAll("#dayCard .exth").forEach(im=>{
    im.onclick = ()=> openImg(im.dataset.big, decodeURIComponent(im.dataset.bn||""));
  });
  document.querySelectorAll("#dayCard .del").forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.del;
      const nm = mem.logs[sel].moves[i].n;
      mem.logs[sel].moves.splice(i,1);
      if(!mem.logs[sel].moves.length) delete mem.logs[sel];
      store(); renderCal(); renderDay();
      toast("已删除 "+nm);
    };
  });
}

function lastOf(name){
  const ds = Object.keys(mem.logs).filter(d=> d<sel).sort().reverse();
  for(const d of ds){
    const m = (mem.logs[d].moves||[]).find(x=>x.n===name);
    if(m && (m.w!==""||(m.s||[]).some(x=>x!=="")||m.dur)) return {d:d, w:m.w, s:m.s, dur:m.dur, note:m.note};
  }
  return null;
}

// ---------- 动作选择器 ----------
let pkTab = "全部", pkQuery = "";
const PK_TABS = ["全部","胸","背","腿","肩","手臂","核心","有氧"];

function openImg(src, name){
  if(!src) return;
  document.getElementById("imBig").src = src;
  document.getElementById("imTitle").textContent = name || "动作示范";
  document.getElementById("imgSheet").classList.remove("hidden");
}
function openPicker(){
  document.getElementById("picker").classList.remove("hidden");
  pkTab="全部"; pkQuery="";
  document.getElementById("pkQ").value="";
  renderPkTabs(); renderPkList();
}
function closePicker(){ document.getElementById("picker").classList.add("hidden"); }

function renderPkTabs(){
  document.getElementById("pkTabs").innerHTML = PK_TABS.map(t=>
    `<button class="${t===pkTab?"on":""}" data-t="${t}">${t}</button>`).join("");
  document.querySelectorAll("#pkTabs button").forEach(b=>{
    b.onclick = ()=>{ pkTab=b.dataset.t; renderPkTabs(); renderPkList(); };
  });
}

function pkRows(){
  const q = pkQuery.trim();
  if(q){
    const low = q.toLowerCase();
    return COMMON.filter(c=> c.n.includes(q) || (c.e||"").toLowerCase().includes(low) || (TG_CN[c.t]||"").includes(q));
  }
  if(pkTab==="全部") return COMMON;
  return COMMON.filter(c=> c.g === pkTab);
}

function renderPkList(){
  const rows = pkRows();
  const items = rows.map(r=>{
    const meta = [(EQ_CN[r.e]||r.e)||"", (TG_CN[r.t]||"")||""].filter(Boolean).join(" · ");
    return `<div class="pk-item" data-n="${encodeURIComponent(r.n)}" data-e="${encodeURIComponent(r.e||"")}" data-t="${encodeURIComponent(r.t||"")}" data-g="${encodeURIComponent(r.g||"")}" data-c="${r.cardio?1:0}" data-img="${encodeURIComponent(r.img||"")}">
      ${r.img?`<img class="pth" src="${r.img}" loading="lazy" alt="">`:`<span class="pth ph"></span>`}
      <span class="nm">${r.n}</span><span class="mt" data-g="${r.g||""}">${meta}</span>
    </div>`;
  }).join("");
  document.getElementById("pkList").innerHTML = items || `<p class="empty">没有匹配的动作</p>`;
  document.querySelectorAll("#pkList .pk-item").forEach(el=>{
    el.onclick = ()=>{
      const mv = blankMove({n:decodeURIComponent(el.dataset.n), e:decodeURIComponent(el.dataset.e), t:decodeURIComponent(el.dataset.t), g:decodeURIComponent(el.dataset.g), cardio:el.dataset.c==="1"});
      mv.img = decodeURIComponent(el.dataset.img);
      dayLog(sel).moves.push(mv);
      store(); renderCal(); renderDay(); closePicker();
      toast("已添加 "+mv.n);
    };
  });
}

// ---------- 周总结 ----------
function mondayOf(ds){
  const d = parseD(ds);
  const off = (d.getDay()+6)%7;
  d.setDate(d.getDate()-off);
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function shiftDays(ds, n){
  const d = parseD(ds); d.setDate(d.getDate()+n);
  const p=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function weekStats(start){
  const days = [];
  for(let i=0;i<7;i++) days.push(shiftDays(start,i));
  const sess = days.filter(d=> mem.logs[d] && (mem.logs[d].moves||[]).length);
  let vol = 0; const grp = {}; const sets = {}; let cardioMin = 0;
  sess.forEach(d=>{
    const lg = mem.logs[d];
    vol += dayVol(lg);
    lg.moves.forEach(m=>{
      if(m.cardio){ cardioMin += Number(m.dur)||0; grp["有氧"] = (grp["有氧"]||0)+1; return; }
      const g = grpOf(m);
      const ns = (m.s||[]).filter(x=>x!=="").length || 0;
      grp[g] = (grp[g]||0) + ns;
      sets[g] = (sets[g]||0) + 1;
    });
  });
  const totSets = Object.keys(grp).reduce((a,k)=> k==="有氧" ? a : a+grp[k], 0);
  return {days, sess, vol, grp, totSets, cardioMin};
}

// ---------- 云同步 ----------
const CKEY = "ppl_cloud_v2", GFILE = "ppl-data.json";

async function ghApi(method, path, body){
  const r = await fetch("https://api.github.com"+path, {
    method: method,
    headers: {"Authorization":"Bearer "+cloud.token, "Accept":"application/vnd.github+json", "Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : undefined
  });
  if(!r.ok){ const t = await r.text().catch(()=> ""); throw new Error(r.status+" "+t.slice(0,80)); }
  return r.json();
}

function normRemote(remote){
  if(remote && remote.logs) return remote.logs;
  const logs = {};
  if(remote && remote.history){
    Object.keys(remote.history).forEach(k2=>{
      const parts = k2.split("|"), act = parts[1];
      (remote.history[k2]||[]).forEach(e=>{
        if(!e.d) return;
        if(!logs[e.d]) logs[e.d] = {moves:[]};
        logs[e.d].moves.push({n:act, e:"", t:"", g:"", w:(e.w==null?"":String(e.w)), s:(e.s||[]).map(x=>x==null?"":String(x)), r:(e.r==null?"":String(e.r))});
      });
    });
  }
  return logs;
}

async function cloudPull(silent){
  if(!cloud.token){ updateCloudUI("off","未连接 · 数据只在本机"); return; }
  try{
    updateCloudUI("sync","同步中…");
    if(!cloud.gist){
      const list = await ghApi("GET","/gists?per_page=100");
      const f = Array.isArray(list) ? list.find(g=> g.files && g.files[GFILE]) : null;
      if(!f){ updateCloudUI("ok","已连接 · 云端暂无数据"); return; }
      cloud.gist = f.id; saveCloud();
    }
    const g = await ghApi("GET","/gists/"+cloud.gist);
    const file = g.files && g.files[GFILE];
    if(!file){ updateCloudUI("ok","云端还没有数据"); return; }
    const txt = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
    const rl = normRemote(JSON.parse(txt));
    let added = 0;
    Object.keys(rl).forEach(d=>{
      if(!mem.logs[d] || !(mem.logs[d].moves||[]).length){ mem.logs[d] = rl[d]; added++; }
    });
    if(added){ localStorage.setItem(KEY, JSON.stringify(mem)); renderCal(); renderDay(); }
    cloud.last = Date.now(); saveCloud();
    updateCloudUI("ok", added ? ("已拉取 "+added+" 天") : "已是最新");
  }catch(e){ updateCloudUI("err","拉取失败："+e.message); }
}

async function cloudPush(){
  if(!cloud.token) return;
  try{
    updateCloudUI("sync","上传中…");
    const body = {description:"训练日志", public:false,
      files:{[GFILE]:{content: JSON.stringify({v:2, logs:mem.logs, t:Date.now()})}}};
    if(!cloud.gist){
      const g = await ghApi("POST","/gists", body);
      cloud.gist = g.id;
    }else{
      await ghApi("PATCH","/gists/"+cloud.gist, body);
    }
    cloud.last = Date.now(); saveCloud();
    updateCloudUI("ok","已上传 · 共 "+Object.keys(mem.logs).length+" 天");
  }catch(e){ updateCloudUI("err","上传失败："+e.message); }
}

// ---------- 导入 ----------
function splitCsv(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===','){ out.push(cur); cur=""; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
const EX_MOD = /^(杠铃|哑铃|绳索|器械|固定器械|史密斯|单臂|坐姿|站姿|上斜|下斜|平板|俯身|颈后|过顶|窄距|宽距|锤式|牧师凳|悬垂|反向|交替|双杠)/;
function coreName(s){ return s.replace(EX_MOD, "").replace(/^[\/\s]+/, "").trim(); }
function lcsLen(a,b){
  let m=0;
  for(let i=0;i<a.length;i++){
    for(let j=0;j<b.length;j++){
      let k=0;
      while(a[i+k] && b[j+k] && a[i+k]===b[j+k]) k++;
      if(k>m) m=k;
    }
  }
  return m;
}
function overlapScore(a,b){
  const B = b.split("");
  let n = 0;
  a.split("").forEach(ch=>{ const i = B.indexOf(ch); if(i>=0){ n++; B.splice(i,1); } });
  return n;
}
function findEx(name){
  const clean = String(name||"").replace(/\s+/g," ").trim();
  if(!clean) return null;
  let c = COMMON.find(x=> x.n===clean); if(c) return c;
  const parts = clean.split("/").map(s=>s.trim()).filter(Boolean);
  for(const p of parts){ c = COMMON.find(x=> x.n===p); if(c) return c; }
  const q = clean.replace(/[\/\s·]/g,"");
  const cands = [];
  COMMON.forEach(x=>{
    const cn = x.n.replace(/[\/\s·]/g,"");
    const ov = overlapScore(q, cn);
    if(ov>=2) cands.push({x:x, ov:ov, ratio: ov/q.length});
  });
  if(!cands.length) return null;
  cands.sort((a,b)=> b.ratio-a.ratio || b.ov-a.ov);
  return cands[0].ratio>=0.6 ? cands[0].x : null;
}
function putMove(d, mv){
  if(!mem.logs[d]) mem.logs[d] = {moves:[]};
  const arr = mem.logs[d].moves;
  const i = arr.findIndex(m=> m.n===mv.n);
  if(i>=0) arr[i] = mv; else arr.push(mv);
}
function mergeCsv(text){
  const lines = text.split(/\r?\n/).filter(x=>x.trim());
  if(lines.length<2) return 0;
  let n=0;
  for(let i=1;i<lines.length;i++){
    const c = splitCsv(lines[i]);
    const d = c[0];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
    const name = c[2]; if(!name) continue;
    const ex = findEx(name);
    const mv = ex ? blankMove(ex) : {n:name,e:"",t:"",g:"",img:"",w:"",s:["","","",""],r:"",cardio:false,dur:"",note:""};
    if(!ex) mv.n = name;
    const w = c[3]||"";
    const reps = [c[4],c[5],c[6],c[7]].map(x=>x||"");
    if(/^\d+(\.\d+)?$/.test(w)){ mv.w = w; mv.s = reps; }
    else { mv.dur = w; }
    putMove(d, mv);
    n++;
  }
  return n;
}
function mergeJson(obj){
  let n=0;
  const src = obj && (obj.logs || obj.history || null);
  if(src && !Array.isArray(src)){
    Object.keys(src).forEach(d=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      const lg = src[d];
      (lg.moves||[]).forEach(m=>{
        const ex = findEx(m.n);
        const mv = ex ? blankMove(ex) : {n:m.n,e:m.e||"",t:m.t||"",g:m.g||"",img:m.img||"",w:"",s:["","","",""],r:"",cardio:false,dur:"",note:""};
        mv.w = m.w||""; mv.s = (m.s||["","","",""]).slice(0,4);
        while(mv.s.length<4) mv.s.push("");
        if(m.cardio){ mv.cardio=true; mv.dur=m.dur||""; mv.note=m.note||""; }
        putMove(d, mv);
        n++;
      });
    });
  }
  if(obj && obj.profile && !mem.profile.h) mem.profile = obj.profile;
  return n;
}
function readFile(input, cb){
  const f = input.files && input.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=> cb(String(r.result||""));
  r.readAsText(f, "utf-8");
}
